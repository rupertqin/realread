<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <title>RealRead</title>
  <!-- The mark is a monogram R drawn as a single-weight stroke, not as a font
       glyph, so it renders identically without depending on installed fonts.
       Stroke width 15/128 stays ~1.9px at 16px, the smallest size Chrome uses. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22303F"/>
      <stop offset="1" stop-color="#131B25"/>
    </linearGradient>
  </defs>

  <rect x="1" y="1" width="126" height="126" rx="28" fill="url(#tile)" stroke="#FFFFFF" stroke-opacity="0.07" stroke-width="2"/>

  <g transform="translate(0,-2)" fill="none" stroke="#F7F3E9" stroke-width="15" stroke-linecap="butt" stroke-linejoin="miter">
    <!-- stem, top bar and bowl -->
    <path d="M38 94 V34 H72 A19 19 0 0 1 72 72 H38"/>
    <!-- leg -->
    <path d="M66 72 L92 98"/>
  </g>
</svg>
